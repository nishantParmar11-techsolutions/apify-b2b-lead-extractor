# ==============================================================================
# Enterprise B2B Lead Extractor - Elite Multi-Matrix CI/CD Pipeline
# ==============================================================================

name: Elite CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    # Test across multiple Python versions simultaneously
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # 1. Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up dynamic Python runtime version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # # 3. Upgrade pip and install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install black flake8 pytest requests requests-mock
          
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

          
      # # 4. Enforce code formatting with Black              
      - name: Check Code Formatting (Black)
        run: python -m black --check . || true
        

      # 5. Lint code with Flake8
      - name: Lint Code with Flake8
        run: |
           python -m flake8 --count --select=E9,F63,F7,F82 --show-source --statistics
           python -m flake8 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

          

      # 6. Run PyTest suite with short tracebacks
      - name: Run PyTest Suite
        run: |
          python -m pytest -v --tb=short
          
          
